name: Build Installer

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 5.0.x
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    
    - name: Publish
      run: dotnet publish -c Release -r win-x64 --self-contained true -f net5.0-windows
    
    - name: Install NSIS
      run: |
        $nsisUrl = "https://sourceforge.net/projects/nsis/files/NSIS%203/3.08/nsis-3.08-setup.exe/download"
        $nsisInstaller = "$env:TEMP\nsis-setup.exe"
        Invoke-WebRequest -Uri $nsisUrl -OutFile $nsisInstaller
        Start-Process -FilePath $nsisInstaller -ArgumentList "/S" -Wait
        echo "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    
    - name: Compile NSIS Script
      run: |
        makensis PackageNSIS.nsi
    
    - name: Upload Installer
      uses: actions/upload-artifact@v3
      with:
        name: ExcelMerge-Setup
        path: ExcelMerge-Setup.exe
    
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: ExcelMerge-Setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
